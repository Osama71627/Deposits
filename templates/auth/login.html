{% extends "shared/base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card fade-in">
        <div class="logo">
            <h1>Deposits</h1>
            <p>منصة التخزين الذكية</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            {% if form.errors %}
            <div class="text-danger" style="font-size:13px;margin-bottom:12px;">
                اسم المستخدم أو كلمة المرور غير صحيحة
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> دخول
            </button>
        </form>
        <div class="auth-footer">
            <p>منصة مؤسسية لإدارة التخزين والتوصيل</p>
        </div>
    </div>
</div>
{% endblock %}
